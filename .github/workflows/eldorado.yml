name: Notificaciones Eldorado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eldorado
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar notificaciones
        env:
          ELDORADO_CLIENT_ID: ${{ secrets.ELDORADO_CLIENT_ID }}
          ELDORADO_CLIENT_SECRET: ${{ secrets.ELDORADO_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify.mjs
      - name: Guardar estado
        run: |
          git config user.name "eldorado-bot"
          git config user.email "eldorado-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
